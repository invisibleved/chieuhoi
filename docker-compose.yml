services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chieuhoi
    ports:
      # Host port 5433 để không đụng Postgres cục bộ khác dùng 5432.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Giả lập S3 để diễn tập staging ở máy (R11). Chỉ chạy khi: docker compose --profile s3 up -d
  # Tag ghim (không dùng latest). Đã kiểm chạy được với image có sẵn trên máy; lệnh pull từ quay.io chưa kiểm được.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ['s3']
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # CORS cho tải ảnh trực tiếp từ trình duyệt (clientUploads, R8).
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3200
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ['s3']
    depends_on:
      - minio
    restart: 'no'
    entrypoint: ['/bin/sh', '/create-bucket.sh']
    environment:
      S3_BUCKET: chieuhoi-staging
    volumes:
      - miniodata:/data
      - ./docker/minio/create-bucket.sh:/create-bucket.sh:ro

volumes:
  pgdata:
  miniodata:
